name: nightcore_player_flutter
description: A compact music player with real-time speed and pitch control for Nightcore-style effects.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  just_audio: ^0.9.40
  audio_service: ^0.18.15
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  # Persistent, permanent app storage directory for copied audio files
  # (needed so queue persistence survives across app restarts — see
  # PlayerController's queue persistence logic).
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true