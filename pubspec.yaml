name: nightcore_player_flutter
description: A compact music player with real-time speed and pitch control for Nightcore-style effects.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio playback engine with speed/pitch support
  just_audio: ^0.9.40
  # Background playback + system notification / lock-screen media controls
  audio_service: ^0.18.15
  # File picking for local audio files
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  # Runtime permission requests (e.g. Android 13+ notification permission)
  permission_handler: ^11.3.1
  # Cupertino icons (default Flutter asset, keep for iOS-style icons if needed)
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true